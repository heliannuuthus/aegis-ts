# Generated by cicd-harness. Extend Hephaestus instead of adding local steps.
name: Pipeline

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: heliannuuthus/hephaestus/.github/workflows/ci-node.yml@main
    permissions:
      contents: read
    with:
      workdir: './'
      node-version: 'lts/*'
      build: 'build'
      type-check: 'type-check'
      test: 'test:ci'
      pack: true

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    uses: heliannuuthus/hephaestus/.github/workflows/ci-publish-node.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      workdir: './'
      node-version: 'lts/*'
      registry-url: 'https://registry.npmjs.org'
